name: SEPA Japan Market Screener

on:
  schedule:
    # 월~금 한국 시간 오후 5시 10분 (KST) = UTC 08:10 자동 실행
    - cron: '10 8 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행 가능

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install yfinance pandas requests

      - name: 일본장 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python screener_japan.py
