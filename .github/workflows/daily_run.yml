name: SEPA Daily Screener

on:
  schedule:
    # 한국 시간 기준 매일 오전 6시 30분 자동 실행 (미국 정규장 마감 30분 후, UTC 21:30)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Actions 탭에서 버튼을 눌러 언제든 즉시 수동 실행 허용

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 3.10 환경 구성
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 패키지 설치 (yfinance, pandas, 위키피디아 파싱용 lxml/html5lib)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml html5lib

      - name: S&P 500 미네르비니 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python screener.py
