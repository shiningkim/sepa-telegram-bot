name: SEPA Daily Screener Korea

on:
  schedule:
    # 한국 시간 기준 매일 오후 4시 실행 (월~금, UTC 07:00)
    - cron: '12 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 허용

jobs:
  run-screener-korea:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader pandas requests

      - name: 국내 주식 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python korea_screener.py
