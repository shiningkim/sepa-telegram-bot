name: Peter Lynch Screener Agent

on:
  schedule:
    # 한국 장 마감 후 (평일 KST 16:30 -> UTC 07:30)
    - cron: '30 7 * * 1-5'
    # 미국 장 마감 후 (평일 EST 17:00 -> UTC 22:00)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance requests pandas beautifulsoup4 lxml

      - name: Run Lynch Screeners
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python kr_lynch_agent.py
          python us_lynch_agent.py
