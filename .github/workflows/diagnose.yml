name: SEPA Stock Diagnosis

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '진단할 티커 또는 종목명 (예: FROG, TSLA, 000250, 삼천당제약)'
        required: true
        default: 'FROG'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install yfinance finance-datareader pandas requests

      - name: 종목 진단 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_TICKER: ${{ github.event.inputs.ticker }}
        run: |
          python diagnose.py
