name: SEPA Japan Early Stage 2 Screener

on:
  schedule:
    # 월~금 한국 시간 오후 5시 20분 (KST) = UTC 08:20 자동 실행
    - cron: '20 8 * * 1-5'
  workflow_dispatch: # 즉시 수동 실행 버튼

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install yfinance pandas requests

      - name: 일본장 Early Stage 2 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python early_stage2_japan.py
