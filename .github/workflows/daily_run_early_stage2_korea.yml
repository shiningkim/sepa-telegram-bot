name: SEPA Korea Early Stage 2 Screener

on:
  schedule:
    # 한국 시간 기준 매주 월~금 오후 4시 10분 KST (UTC 07:10) 자동 실행
    - cron: '10 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 버튼을 눌러 언제든 즉시 수동 실행 가능

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install finance-datareader pandas requests

      - name: Korea Early Stage 2 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python early_stage2_korea.py
